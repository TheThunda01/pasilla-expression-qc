name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python audit_results.py verify --manifest audits/example-artifacts.json
      - run: python analysis.py --out /tmp/pasilla-qc-results
      - run: python compare_results.py results /tmp/pasilla-qc-results --report /tmp/pasilla-comparison.json
      - run: python audit_results.py create --results /tmp/pasilla-qc-results --manifest /tmp/pasilla-audit.json
      - run: python audit_results.py verify --results /tmp/pasilla-qc-results --manifest /tmp/pasilla-audit.json
